<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard E-MEDIK</title>
    
    <!-- SCRIPT PENJAGA PINTU (Wajib ditaruh paling atas) -->
    <script>
        // Memeriksa apakah tiket masuk ("kunciAkses") ada di browser
        if (sessionStorage.getItem("kunciAkses") !== "diizinkan") {
            // Jika tidak ada tiket, otomatis tendang kembali ke halaman login
            window.location.replace("login.html");
        }
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #1e293b; }
        p { color: #475569; }
    </style>
</head>
<body>
    <h1>Selamat Datang di Dashboard E-MEDIK</h1>
    <p>Akses berhasil dilindungi. Hanya staf yang login yang bisa melihat halaman ini.</p>
</body>
</html>
